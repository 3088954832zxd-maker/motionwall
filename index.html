<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MotionWall | 动态壁纸精选</title>
    <meta
      name="description"
      content="MotionWall 是一个适配手机、平板和电脑的动态壁纸网站，支持搜索、分类筛选、在线预览和下载。"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <div class="brand" aria-label="MotionWall 品牌">
          <div class="brand-mark">M</div>
          <span>MotionWall</span>
        </div>
        <div class="nav-actions">
          <span class="chip">动态壁纸</span>
          <span class="chip">适配全终端</span>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="hero">
        <div class="hero-inner">
          <div>
            <h1 class="headline">
              用 <span class="gradient-text">MotionWall</span>
              发现属于你的屏幕灵感。
            </h1>
            <p class="hero-copy">
              MotionWall 是一个适配手机、平板和电脑的壁纸发现站，支持搜索、分类筛选、在线预览和下载，
              让每一个屏幕都更有生命力。
            </p>
            <div class="hero-actions">
              <button class="button primary" type="button" id="exploreBtn">开始浏览</button>
              <button class="button secondary" type="button" id="downloadBtn">下载精选</button>
            </div>
            <div class="stats" aria-label="网站数据统计">
              <div class="stat">
                <strong>1400+</strong>
                <span>精选壁纸</span>
              </div>
              <div class="stat">
                <strong>8</strong>
                <span>分类主题</span>
              </div>
              <div class="stat">
                <strong>3x</strong>
                <span>终端适配</span>
              </div>
            </div>
          </div>

          <div class="hero-panel" aria-label="预览面板">
            <div class="screen">
              <div class="screen-top">
                <div class="dots">
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
                <span class="chip">精选</span>
              </div>
              <div class="phone-visual">
                <div class="phone-card">
                  <div class="mini-header">
                    <span>Live Wallpapers</span>
                    <span>New</span>
                  </div>
                  <div class="mini-grid">
                    <div class="mini-tile"></div>
                    <div class="mini-tile"></div>
                    <div class="mini-tile"></div>
                    <div class="mini-tile"></div>
                  </div>
                  <div class="mini-header">
                    <span>分类：赛博、自然</span>
                    <span>4K</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section aria-label="壁纸筛选区域">
        <div class="filters-bar">
          <label class="search-box" aria-label="搜索壁纸">
            <span aria-hidden="true">🔎</span>
            <input id="searchInput" type="search" placeholder="搜索壁纸名称、标签或分类..." />
          </label>
          <div class="category-list" id="categoryList" aria-label="壁纸类别列表"></div>
        </div>
      </section>

      <section>
        <div class="gallery" id="gallery" aria-live="polite"></div>
      </section>
    </main>

    <div class="modal" id="previewModal" aria-modal="true" role="dialog">
      <div class="modal-box">
        <div class="modal-top">
          <h2 id="modalTitle">壁纸预览</h2>
          <button class="modal-close" type="button" id="closeModal" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <div class="modal-preview">
            <img id="modalImage" src="" alt="壁纸预览" />
          </div>
          <div class="modal-side">
            <div>
              <div class="card-meta" id="modalMeta"></div>
            </div>
            <div class="modal-tags" id="modalTags"></div>
            <p id="modalDescription" style="margin:0;color:var(--muted);line-height:1.8;"></p>
            <div class="modal-actions">
              <a class="button primary" id="downloadLink" href="#" target="_blank" rel="noreferrer">下载壁纸</a>
              <button class="button secondary" type="button" id="closeButton">关闭</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
